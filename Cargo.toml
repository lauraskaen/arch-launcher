[package]
name = "arch-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fast, elegant GTK4 application launcher for Arch Linux with per-launcher app hiding"
license = "MIT"
readme = "README.md"
keywords = ["launcher", "gtk4", "wayland", "rofi", "arch"]
categories = ["gui"]

[[bin]]
name = "arch-launcher"
path = "src/main.rs"

[lib]
name = "arch_launcher"
path = "src/lib.rs"

[features]
default = ["layer-shell"]
# Use the wlr-layer-shell protocol (via gtk4-layer-shell) on Wayland
# compositors that support it: Hyprland, Sway, KDE Plasma, river, niri, …
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
gtk4-layer-shell = { version = "0.8", optional = true }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
