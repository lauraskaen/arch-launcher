# ~/.config/hypr/hyprland.conf
# arch-launcher is single-instance: running it again toggles the window.
bind = SUPER, D, exec, arch-launcher
bind = SUPER SHIFT, D, exec, arch-launcher --hidden-apps

# Optional: keep it resident for instant opening (then SUPER+D just toggles).
# exec-once = arch-launcher --daemon

# Rule syntax below is the one used since Hyprland 0.48 (windowrule = RULE, MATCHER).
# Hyprland has changed rule syntax across releases; if `hyprctl configerrors`
# complains, check https://wiki.hypr.land/Configuring/Window-Rules/ for your version.

# Only needed if you set `layer_shell = false` in config.toml
# (by default it is a layer-shell overlay and is never tiled):
windowrule = float, class:^(io\.github\.archlauncher\.ArchLauncher)$
windowrule = center, class:^(io\.github\.archlauncher\.ArchLauncher)$
windowrule = stayfocused, class:^(io\.github\.archlauncher\.ArchLauncher)$

# Optional blur behind the translucent launcher (layer namespace "arch-launcher"):
layerrule = blur, arch-launcher
layerrule = ignorealpha 0.3, arch-launcher
