# ~/.config/sway/config
# arch-launcher is single-instance: running it again toggles the window.
bindsym $mod+d exec arch-launcher
bindsym $mod+Shift+d exec arch-launcher --hidden-apps

# Optional: keep it resident for instant opening.
# exec arch-launcher --daemon

# Only needed with `layer_shell = false` in config.toml:
for_window [app_id="io.github.archlauncher.ArchLauncher"] floating enable, border none, move position center

# SwayFX only — blur behind the layer surface:
# layer_effects "arch-launcher" blur enable; corner_radius 14
